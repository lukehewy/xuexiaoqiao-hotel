<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>薛小乔酒店欢迎你</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    background: radial-gradient(120% 90% at 50% 0%, #1b2748 0%, #0d1526 45%, #060a16 100%);
    color:#f5efe0;
    overflow:hidden;
    height:100dvh;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  /* ambient glows */
  .glow { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; pointer-events:none; }
  .glow.g1 { width:55vmin; height:55vmin; left:-12vmin; top:-10vmin; background:#27407c; animation:breathe 9s ease-in-out infinite; }
  .glow.g2 { width:48vmin; height:48vmin; right:-10vmin; bottom:-12vmin; background:#5a4310; animation:breathe 11s ease-in-out infinite reverse; }
  @keyframes breathe { 0%,100%{ transform:scale(1); opacity:.45;} 50%{ transform:scale(1.15); opacity:.65;} }
  #stars { position:absolute; inset:0; pointer-events:none; }
  /* light wave at bottom */
  .wave { position:absolute; left:0; right:0; bottom:0; height:22vh; pointer-events:none; opacity:.5;
    background:linear-gradient(to top, rgba(212,175,55,.14), rgba(212,175,55,0) 70%); }
  .wave::before { content:""; position:absolute; left:-25%; right:-25%; top:0; height:2px;
    background:linear-gradient(90deg, transparent, #d4af37 30%, #ffe9a8 50%, #d4af37 70%, transparent);
    animation:sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0%,100%{ transform:translateX(-4%); opacity:.5;} 50%{ transform:translateX(4%); opacity:1;} }

  .card { position:relative; text-align:center; padding:24px 18px; z-index:2; max-width:100vw; }
  .en { font-family: Georgia, "Times New Roman", serif; letter-spacing:.55em; text-indent:.55em;
    font-size:clamp(11px, 3.2vw, 17px); color:#c9a94e; text-transform:uppercase;
    opacity:0; animation:rise 1.1s ease .2s forwards; }
  .hotel { margin-top:3.2vh; font-size:clamp(40px, 12.5vw, 96px); font-weight:700; letter-spacing:.14em; text-indent:.14em; line-height:1.15; color:#f7f1dd; }
  .hotel .ch { display:inline-block; opacity:0; transform:translateY(26px); animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  .line { width:min(62vw, 430px); height:2px; margin:3.4vh auto 0;
    background:linear-gradient(90deg, transparent, #d4af37, #ffe9a8, #d4af37, transparent);
    transform:scaleX(0); animation:grow 1.4s ease 1.15s forwards; }
  @keyframes grow { to { transform:scaleX(1);} }
  .welcome { margin-top:3vh; font-size:clamp(58px, 19vw, 150px); font-weight:800; letter-spacing:.22em; text-indent:.22em; line-height:1.1;
    background:linear-gradient(100deg, #a87f22 0%, #d4af37 25%, #fff2c0 50%, #d4af37 75%, #a87f22 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 4.5s linear 2s infinite; }
  .welcome .ch { display:inline-block; opacity:0; transform:translateY(34px) scale(.92); animation:rise 1s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes shine { 0%{ background-position:120% 0;} 100%{ background-position:-120% 0;} }
  @keyframes rise { to { opacity:1; transform:translateY(0) scale(1);} }
  .sub { margin-top:3.6vh; font-size:clamp(14px, 4.2vw, 22px); letter-spacing:.34em; text-indent:.34em; color:#d8cfae;
    opacity:0; animation:rise 1.2s ease 2s forwards; }
  .sub b { color:#e8c87a; font-weight:600; }
  .foot { margin-top:6vh; font-size:clamp(11px, 3vw, 14px); letter-spacing:.3em; text-indent:.3em; color:rgba(216,207,174,.55);
    opacity:0; animation:rise 1.2s ease 2.6s forwards; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <canvas id="stars"></canvas>
  <div class="wave"></div>

  <main class="card">
    <div class="en">Xue Xiaoqiao Hotel</div>
    <h1 class="hotel" id="hotel">薛小乔酒店</h1>
    <div class="line"></div>
    <div class="welcome" id="welcome">欢迎你</div>
    <div class="sub"><b>Bienvenue</b> · <b>Welcome</b> · 欢迎光临</div>
    <div class="foot">愿您住得舒心 · Wish you a pleasant stay</div>
  </main>

<script>
  // stagger the Chinese characters
  function split(id, base){
    var el = document.getElementById(id);
    var text = el.textContent; el.textContent = "";
    Array.prototype.forEach.call(text, function(c, i){
      var s = document.createElement("span");
      s.className = "ch"; s.textContent = c;
      s.style.animationDelay = (base + i * 0.13) + "s";
      el.appendChild(s);
    });
  }
  split("hotel", 0.35);
  split("welcome", 1.05);

  // floating light particles
  var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), W, H, ps = [];
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  for (var i = 0; i < 46; i++) ps.push({
    x: Math.random(), y: Math.random(), r: Math.random() * 1.9 + .5,
    s: Math.random() * .00045 + .00015, drift: Math.random() * .00012 - .00006,
    p: Math.random() * Math.PI * 2
  });
  (function tick(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(function(p){
      p.y -= p.s; p.x += p.drift; p.p += .012;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      var a = .25 + Math.abs(Math.sin(p.p)) * .55;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(232,200,122," + a.toFixed(3) + ")";
      ctx.fill();
    });
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
